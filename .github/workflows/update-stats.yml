name: Update stats snapshot

on:
  schedule:
    # Every Monday at 12:00 UTC (~7-8am US Eastern, depending on DST)
    - cron: '0 12 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest stats from MLB Stats API
        run: python3 scripts/update_stats.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stats-snapshot.csv data/meta.json
          if git diff --cached --quiet; then
            echo "No stat changes this week."
          else
            git commit -m "Weekly stats snapshot update"
            git push
          fi
